name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Health Check (Render)
        run: curl -s https://restaurant-system-jtp3.onrender.com/api/ishealthy
      - name: Call Health Check (SnapDeploy)
        run: curl - shttps://restaurant-system-backend-beta-e8b87.containers.snapdeploy.app//api/ishealthy
